--bg:var(--p2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Chocolate Classical Sans','Jua','Noto Sans TC','PingFang TC',sans-serif;color:#6b4652;background:#fbf7f8;min-height:100dvh}
body::before{content:"";position:fixed;inset:0;background:var(--bg) center/cover no-repeat;z-index:-1}
body.inner{--bg:var(--p9)}
.small{font-family:'Jua','Chocolate Classical Sans',sans-serif;color:var(--pk);letter-spacing:.22em}
/* home */
#home{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 18px;text-align:center;gap:6px}
#home svg{width:min(62vw,250px);height:auto;overflow:visible}
.rain{stroke-dasharray:5 17;animation:fall 2.4s linear infinite}
@keyframes fall{to{stroke-dashoffset:-44}}
@media(prefers-reduced-motion:reduce){.rain{animation:none}}
h1{font-family:'Caprasimo',serif;font-weight:400;color:var(--gr);font-size:clamp(30px,8vw,56px);line-height:1.08;margin:14px 0 4px;text-shadow:0 2px 0 #fff}
h1 i{color:var(--pk2);font-style:normal;font-size:.5em;vertical-align:.6em}
.sub{font-size:14px;margin:4px 0 22px}
.choices{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.choice{font:inherit;font-size:18px;color:var(--pk);background:rgba(255,255,255,.78);border:2px solid var(--pk2);border-radius:999px;padding:13px 26px;cursor:pointer;letter-spacing:.12em;min-width:190px;transition:transform .15s,background .15s}
.choice:hover,.choice:focus-visible{transform:translateY(-3px);background:#fff;outline:none}
/* inner */
.nav{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;max-width:860px;margin:auto}
.chip{font:inherit;font-size:14px;color:var(--pk);background:rgba(255,255,255,.88);border:1.5px solid var(--pk2);border-radius:999px;padding:7px 16px;cursor:pointer;letter-spacing:.12em}
.stage{max-width:820px;margin:4px auto 40px;width:calc(100% - 24px);border-radius:22px;overflow:hidden;box-shadow:0 10px 34px rgba(150,90,110,.22);background-color:#fbf9f6;background-image:radial-gradient(#e5e5e5 2px,transparent 2.6px);background-size:26px 26px;border-left:14px solid var(--edge);border-right:14px solid var(--edge)}
#gallery{--edge:#e7eff8}#board{--edge:#fdfbd6}
.hero{aspect-ratio:2048/1335;margin:-14px -14px 0;background:var(--hero) center top/cover no-repeat}
#gallery .hero{--hero:var(--p4)}#board .hero{--hero:var(--p6)}
.body{padding:6px 4px 22px;text-align:center}
.tabs{display:flex;gap:10px;justify-content:center;margin:6px 0 12px}
.tab{font:inherit;font-size:16px;color:var(--pk);background:#fff;border:2px solid var(--pk2);border-radius:999px;padding:8px 22px;cursor:pointer;letter-spacing:.1em}
.tab[aria-selected=true]{background:var(--pk);color:#fff;border-color:var(--pk)}
.btn{font:inherit;font-size:15px;color:#fff;background:var(--pk);border:0;border-radius:999px;padding:10px 24px;cursor:pointer;letter-spacing:.1em;display:inline-block}
.btn.ghost{background:#fff;color:var(--pk);border:1.5px solid var(--pk2)}
.frame{position:relative;aspect-ratio:4/3;margin:16px auto 0;width:100%;background:var(--p5) 0 0/100% 100% no-repeat}
.grid{position:absolute;inset:9.5% 6.5% 6.5% 7%;display:grid;grid-template-columns:repeat(var(--c,3),1fr);grid-template-rows:repeat(2,1fr);gap:2.4%}
.ph{margin:0;position:relative;overflow:hidden;border-radius:8px;background:#f7e9ee;border:3px solid #fff;box-shadow:0 2px 8px rgba(150,90,110,.25)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph.off img{opacity:.35}
.ctl{position:absolute;left:0;right:0;bottom:0;display:flex;gap:4px;justify-content:center;padding:3px;background:linear-gradient(transparent,rgba(120,60,80,.55))}
.ctl button,.ncl button{font:inherit;font-size:11px;border:0;border-radius:999px;padding:3px 9px;background:rgba(255,255,255,.92);color:var(--pk);cursor:pointer}
.empty{grid-column:1/-1;grid-row:1/-1;display:grid;place-items:center;font-size:14px;color:var(--pk);margin:0}
.pager{display:flex;gap:12px;justify-content:center;align-items:center;margin:14px 0 4px;font-size:14px}
.pager button:disabled{opacity:.4}
/* board */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px 16px;padding:14px 8px;justify-items:center}
.note{width:100%;max-width:270px}
.paper{aspect-ratio:400/625;background:var(--paper) 0 0/100% 100% no-repeat;padding:17% 15% 15%;display:flex;flex-direction:column;text-align:left}
.paper p{flex:1;margin:0;overflow:hidden;white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.7;color:#6b4652}
.paper small{align-self:flex-end;color:#a98a94;font-size:11px;padding-top:4px}
.note.off .paper{opacity:.4}
.ncl{display:flex;gap:6px;justify-content:center;margin-top:6px}.ncl button{background:#fff;border:1.5px solid var(--pk2);font-size:12px;padding:4px 12px}
.composer{width:min(78vw,290px);margin:14px auto 6px}
.composer .paper{padding-bottom:12%}
textarea{flex:1;width:100%;border:0;background:transparent;resize:none;font:inherit;font-size:15px;line-height:1.7;color:#6b4652;outline:none}
textarea::placeholder{color:#c9a5b1}
.cnt{font-size:11px;color:#a98a94;text-align:right}
/* popups */
#count,#lb{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(90,50,60,.4);padding:16px}
.clip{width:min(86vw,340px);aspect-ratio:440/620;background:var(--clip) 0 0/100% 100% no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24% 14% 14%;color:#4a5620;gap:2px}
.big{font-family:'Caprasimo',serif;font-size:clamp(56px,20vw,84px);color:var(--pk);line-height:1}
#lb img{max-width:100%;max-height:92dvh;border-radius:10px;border:5px solid #fff}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(107,70,82,.92);color:#fff;font-size:14px;padding:10px 20px;border-radius:999px;z-index:30}
#local{font-size:12px;color:#a98a94;margin:8px 0 0}
</style>

<div class="body">
<div id="st2" class="small" style="font-size:12px" hidden></div><div class="small" style="font-size:13px">寫下想說的話，全部匿名顯示</div>
<div class="composer"><div class="paper"><textarea id="txt" maxlength="120" placeholder="想對大家說什麼呢⋯⋯"></textarea><div class="cnt"><span id="cn">0</span>/120</div></div></div>
<button class="btn" id="send">貼到留言板</button>
<div class="wall" id="wall"></div>
</div></div>
</section>

<div id="count" hidden><div class="clip">
<div class="small" style="font-size:13px">從今天起倒數</div>
<div style="font-size:15px">距離畢業還有</div>
<div class="big" id="days">0</div>
<div style="font-size:15px" id="unit">天</div>
<div class="small" style="font-size:12px;margin:6px 0 10px">畢業日：2027年5月18日</div>
<button class="btn" id="cx">好，繼續</button></div></div>
<div id="lb" hidden><img alt="放大的照片"></div>
<button class="chip" id="adm" hidden style="position:fixed;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15">管理員登入</button>
<div id="toast" hidden></div>

<script>
/* ▼▼ 只需要改這裡：貼上你在 Firebase 拿到的設定 ▼▼ */
const firebaseConfig={apiKey:"AIzaSyALemCCqp17nQQiE91vJc02pM8HhzMwYaU",authDomain:"school-memories-ff7e6.firebaseapp.com",projectId:"school-memories-ff7e6",appId:"1:201061238137:web:0e9b9569590018fba6dba8"};
/* ▲▲ */
let ME='',fdb=null,F=null,AU=null,AUTH=null,ADMIN=false;
function setUser(){const u=AUTH.currentUser;ME=u.uid;ADMIN=!!(u.email&&!u.isAnonymous);$('#adm').textContent=ADMIN?'管理員模式（點此登出）':'管理員登入';renderPhotos();renderNotes()}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function h53(s){let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^a>>>16,2246822507)^Math.imul(b^b>>>13,3266489909);b=Math.imul(b^b>>>16,2246822507)^Math.imul(a^a>>>13,3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.k);toast.k=setTimeout(()=>t.hidden=true,2400)}
/* 共用資料庫：Firebase（所有同學看到同一份內容） */
const data={photos:[],notes:[]};
const paint=c=>c==='photos'?renderPhotos():renderNotes();
const need=()=>{if(!F||!ME){toast('還沒連上資料庫，請稍等幾秒再試');throw new Error('offline')}};
const store={
async add(c,o){need();await F.addDoc(F.collection(fdb,c),{...o,h:ME})},
async upd(c,id,p){need();await F.updateDoc(F.doc(fdb,c,id),p)},
async del(c,id){need();await F.deleteDoc(F.doc(fdb,c,id))}};
const say=m=>{for(const id of['#st','#st2']){const s=$(id);s.textContent=m;s.hidden=!m}};
(async()=>{try{
const V='https://www.gstatic.com/firebasejs/10.12.2/';
const[A,Au,Fs]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-auth.js'),import(V+'firebase-firestore.js')]);
const app=A.initializeApp(firebaseConfig);fdb=Fs.getFirestore(app);F=Fs;
AU=Au;AUTH=Au.getAuth(app);await new Promise(r=>{const u=AU.onAuthStateChanged(AUTH,()=>{u();r()})});
if(!AUTH.currentUser)await AU.signInAnonymously(AUTH);
setUser();
['photos','notes'].forEach(c=>F.onSnapshot(F.collection(fdb,c),s=>{data[c]=s.docs.map(d=>({...d.data(),id:d.id}));paint(c)},e=>say('讀取失敗（'+(e.code||e.message)+'）：請檢查 Firestore 規則')));
say('')}catch(e){console.error(e);say('連線失敗（'+(e.code||e.message)+'）：請檢查 Firebase 設定')}})();
/* navigation */
function show(v){['home','gallery','board'].forEach(x=>$('#'+x).hidden=x!==v);document.body.className=v==='home'?'':'inner';scrollTo(0,0);if(v!=='home')openCount();renderPhotos();renderNotes()}
function openCount(){const t=new Date(2027,4,18),n=new Date(),d=Math.ceil((t-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/864e5);
$('#days').textContent=d>0?d:'🎓';$('#unit').textContent=d>0?'天':'畢業快樂！';$('#count').hidden=false}
document.addEventListener('click',e=>{
const g=e.target.closest('[data-go]');if(g)return show(g.dataset.go);
if(e.target.closest('[data-count]'))return openCount();
if(e.target.id==='count'||e.target.id==='cx')$('#count').hidden=true;
if(e.target.id==='lb')$('#lb').hidden=true;
const im=e.target.closest('.ph img');if(im){$('#lb img').src=im.src;$('#lb').hidden=false}
const b=e.target.closest('[data-act]');if(!b)return;const{act,id,c}=b.dataset;
if(act==='del'){if(confirm('確定要刪除嗎？刪除後無法復原'))store.del(c,id).catch(()=>toast('刪除失敗'))}
else store.upd(c,id,{hidden:act==='hide'}).then(()=>toast(act==='hide'?'已撤回，只有你看得到':'已重新發佈')).catch(()=>toast('操作失敗'))});
/* gallery */
let cat='hs',page=0;const PS=()=>matchMedia('(min-width:700px)').matches?6:4;
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{cat=t.dataset.cat;page=0;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));$('#upn').textContent=cat==='hs'?'高中':'初中';renderPhotos()});
$('#prev').onclick=()=>{page--;renderPhotos()};$('#next').onclick=()=>{page++;renderPhotos()};addEventListener('resize',()=>renderPhotos());
const admd=(c,p)=>`<div class="ctl"><button data-act="del" data-c="${c}" data-id="${p.id}">刪除</button></div>`;
const ctl=(c,p)=>p.h===ME?`<div class="ctl">${p.hidden?`<button data-act="show" data-c="${c}" data-id="${p.id}">重新發佈</button>`:`<button data-act="hide" data-c="${c}" data-id="${p.id}">撤回</button>`}<button data-act="del" data-c="${c}" data-id="${p.id}">刪除</button></div>`:ADMIN?admd(c,p):'';
function renderPhotos(){const all=data.photos.filter(p=>!p.hidden||p.h===ME||ADMIN);
$('#n-hs').textContent=all.filter(p=>p.cat==='hs').length;$('#n-jh').textContent=all.filter(p=>p.cat==='jh').length;
const list=all.filter(p=>p.cat===cat).sort((a,b)=>b.t-a.t),ps=PS(),pages=Math.max(1,Math.ceil(list.length/ps));
page=Math.min(Math.max(page,0),pages-1);const g=$('#grid');g.style.setProperty('--c',ps===6?3:2);
g.innerHTML=list.length?list.slice(page*ps,page*ps+ps).map(p=>`<figure class="ph ${p.hidden?'off':''}"><img src="${p.img}" alt="同學上傳的照片">${ctl('photos',p)}</figure>`).join(''):'<p class="empty">還沒有照片，成為第一個上傳的人吧</p>';
$('#pg').textContent=`第 ${page+1} / ${pages} 頁`;$('#prev').disabled=page<=0;$('#next').disabled=page>=pages-1}
const shrink=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.72))};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(f)});
$('#file').onchange=async e=>{const fs=[...e.target.files];e.target.value='';toast('上傳中⋯⋯');let n=0;
for(const f of fs){try{await store.add('photos',{cat,img:await shrink(f),t:Date.now(),h:ME,hidden:false});n++}catch(x){toast('有照片上傳失敗，請再試一次')}}
if(n)toast(`已上傳 ${n} 張到「${cat==='hs'?'高中':'初中'}」`)};
/* board */
$('#txt').oninput=e=>$('#cn').textContent=e.target.value.length;
$('#send').onclick=async()=>{const v=$('#txt').value.trim();if(!v)return toast('先寫點什麼吧');
try{await store.add('notes',{text:v,t:Date.now(),h:ME,hidden:false});$('#txt').value='';$('#cn').textContent=0;toast('已貼上留言板')}catch(e){toast('留言失敗，請再試一次')}};
function renderNotes(){const l=data.notes.filter(n=>!n.hidden||n.h===ME||ADMIN).sort((a,b)=>b.t-a.t);
$('#wall').innerHTML=l.length?l.map(n=>`<div class="note ${n.hidden?'off':''}"><div class="paper"><p>${esc(n.text)}</p><small>匿名同學・${new Date(n.t).toLocaleDateString('zh-TW')}</small></div>${n.h===ME?`<div class="ncl">${n.hidden?`<button data-act="show" data-c="notes" data-id="${n.id}">重新發佈</button>`:`<button data-act="hide" data-c="notes" data-id="${n.id}">撤回</button>`}<button data-act="del" data-c="notes" data-id="${n.id}">刪除</button></div>`:ADMIN?`<div class="ncl"><button data-act="del" data-c="notes" data-id="${n.id}">刪除</button></div>`:''}</div>`).join(''):'<p class="small" style="grid-column:1/-1;font-size:13px">還沒有留言，寫下第一張吧</p>'}
$('#adm').onclick=async()=>{if(!AU)return toast('還沒連上，請稍等');try{if(ADMIN){await AU.signOut(AUTH);await AU.signInAnonymously(AUTH)}else await AU.signInWithPopup(AUTH,new AU.GoogleAuthProvider());setUser()}catch(e){toast('登入失敗：'+(e.code||e.message))}};
if(location.hash==='#admin')$('#adm').hidden=false;
renderPhotos();renderNotes();
</script>
</body>
</html>
